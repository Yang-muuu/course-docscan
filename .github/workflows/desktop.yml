name: Windows portable package

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  PYTHONUTF8: '1'

jobs:
  package:
    runs-on: windows-2025
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13.7'
      - name: Install pinned dependencies
        run: |
          python -m pip install -r requirements.win-py313.lock
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m pip install --no-build-isolation --no-deps -e .
      - name: Bundle the application and local OCR models
        run: |
          python -m docscan prepare-models
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python scripts/build_desktop.py --output 'dist/课程 验收/DocScan'
      - name: Exercise the packaged launcher and desktop workflow
        run: |
          & '.\dist\课程 验收\DocScan\runtime\python.exe' -X utf8 -B scripts/verify_desktop.py --output outputs/desktop-host
      - name: Create the acceptance ZIP
        run: |
          $package = (Resolve-Path -LiteralPath 'dist/课程 验收/DocScan').Path
          $zip = Join-Path $env:RUNNER_TEMP 'DocScan.zip'
          [IO.Compression.ZipFile]::CreateFromDirectory($package, $zip, [IO.Compression.CompressionLevel]::Fastest, $true)
      - uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/DocScan.zip
          archive: false
          if-no-files-found: error
          retention-days: 1

  clean-desktop:
    needs: package
    runs-on: windows-2025
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8
        with:
          name: DocScan.zip
          path: ${{ runner.temp }}
      - name: Extract the package and verify on a separate Windows desktop
        run: |
          $destination = (New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/课程 解压").FullName
          [IO.Compression.ZipFile]::ExtractToDirectory((Join-Path $env:RUNNER_TEMP 'DocScan.zip'), $destination)
          ./scripts/verify_clean_windows.ps1 -Bundle "$destination/DocScan"
